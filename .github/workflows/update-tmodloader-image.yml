name: "Update"

on:
  workflow_call:
    inputs:
      SHOULD_UPDATE:
        required: false
        default: "false"
        type: string
        description: "Whether to update the tModLoader version in the Dockerfile"
      REPO_VERSION:
        required: true
        type: string
        description: "The tModLoader version to tag the image with"
      CURRENT_VERSION:
        required: true
        type: string
        description: "The currently used tModLoader version"
      AS_LATEST:
        required: false
        default: true
        type: boolean
        description: "Also push the image as :latest"

permissions:
  contents: write

jobs:
  update-tmodloader-image:
    name: Push Docker Image to Registry
    runs-on: ubuntu-latest
    env:
      SHOULD_UPDATE: ${{ inputs.SHOULD_UPDATE }}
      REPO_VERSION: ${{ inputs.REPO_VERSION }}
      CURRENT_VERSION: ${{ inputs.CURRENT_VERSION }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: tmodloader1.4-image
          path: ${{ runner.temp }}/
      - run: docker load -i ${{ runner.temp }}/tmodloader1.4-image.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push version tag
        run: |
          docker tag nonjerry/tmodloader1.4:ci "${{ vars.DOCKER_USER }}/tmodloader1.4:$REPO_VERSION"
          docker push "${{ vars.DOCKER_USER }}/tmodloader1.4:$REPO_VERSION"

      - name: Push latest tag
        if: ${{ inputs.AS_LATEST }}
        run: |
          docker tag nonjerry/tmodloader1.4:ci "${{ vars.DOCKER_USER }}/tmodloader1.4:latest"
          docker push "${{ vars.DOCKER_USER }}/tmodloader1.4:latest"

      - name: Update Dockerfile Version
        if: ${{ env.SHOULD_UPDATE == 'true' }}
        run: sed -i "s/$CURRENT_VERSION/$REPO_VERSION/" ./Dockerfile

      - uses: stefanzweifel/git-auto-commit-action@v7
        if: ${{ env.SHOULD_UPDATE == 'true' }}
        with:
          commit_user_name: Merge Bot
          commit_message: "Github Action: Updating to tModLoader version ${{ env.REPO_VERSION }}"
          commit_options: "--no-verify --signoff"
          repository: .
          tagging_message: "${{ env.REPO_VERSION }}"
          create_branch: false
