name: Custom Build of tModLoader Repository
on:
  workflow_dispatch:
    inputs:
      release:
        description: "The tModLoader Release to download and build."
        required: true
        type: string
      aslatest:
        description: "Should this push as latest?"
        required: true
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  check-tmodloader-version:
    name: Check tModLoader Version
    uses: ./.github/workflows/check-version.yml
    with:
      TARGET_VERSION: ${{ inputs.release }}

  build:
    name: Build
    needs: check-tmodloader-version
    uses: ./.github/workflows/build.yml
    with:
      SHOULD_UPDATE: ${{ needs.check-tmodloader-version.outputs.SHOULD_UPDATE }}
      REPO_VERSION: ${{ needs.check-tmodloader-version.outputs.REPO_VERSION }}
      CURRENT_VERSION: ${{ needs.check-tmodloader-version.outputs.CURRENT_VERSION }}

  tests:
    name: Tests
    needs:
      - check-tmodloader-version
      - build
    uses: ./.github/workflows/test.yml
    with:
      SHOULD_UPDATE: ${{ needs.check-tmodloader-version.outputs.SHOULD_UPDATE }}
      REPO_VERSION: ${{ needs.check-tmodloader-version.outputs.REPO_VERSION }}
      CURRENT_VERSION: ${{ needs.check-tmodloader-version.outputs.CURRENT_VERSION }}

  push:
    name: Update Docker Image in Docker Registry
    needs:
      - check-tmodloader-version
      - tests
    uses: ./.github/workflows/update-tmodloader-image.yml
    secrets: inherit
    # SHOULD_UPDATE stays at its "false" default: custom builds never commit a Dockerfile change
    with:
      REPO_VERSION: ${{ inputs.release }}
      CURRENT_VERSION: ${{ needs.check-tmodloader-version.outputs.CURRENT_VERSION }}
      AS_LATEST: ${{ inputs.aslatest }}
