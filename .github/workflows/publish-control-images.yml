name: "Publish"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    name: Push ${{ matrix.image.repository }} to Docker Hub
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - artifact: terraria-backend-prod-image
            source: nonjerry/terraria-backend-prod:ci
            repository: terraria-backend
          - artifact: terraria-frontend-image
            source: nonjerry/terraria-frontend:ci
            repository: terraria-frontend
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.image.artifact }}
          path: ${{ runner.temp }}/
      - run: docker load -i ${{ runner.temp }}/${{ matrix.image.artifact }}.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push image
        run: |
          docker tag ${{ matrix.image.source }} "${{ vars.DOCKER_USER }}/${{ matrix.image.repository }}:latest"
          docker push "${{ vars.DOCKER_USER }}/${{ matrix.image.repository }}:latest"
